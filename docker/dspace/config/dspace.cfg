# DELTA DIGEEX para dspace.cfg (Patrón 2 — ver docs/06-referencias/convencion-config-docker-vs-backend.md)
#
# Este archivo NO es un dspace.cfg completo. Es solo el fragmento DIGEEX a
# inyectar en el dspace.cfg stock de DSpace para que cargue el schema custom
# del portal (digeex-types.xml) al arrancar.
#
# Posición: dentro del bloque "##### Registry Loader #####", justo después de
#   registry.metadata.load = coar-types.xml
# (la última línea stock de la lista registry.metadata.load).
#
# Por qué acá y no en local.cfg: local.cfg está en modo override
# (config-definition.xml) y, al ser registry.metadata.load una propiedad
# multivaluada, definirla en local.cfg REEMPLAZA toda la lista stock en vez de
# sumar. Por eso la línea va en dspace.cfg, donde cada línea repetida se acumula.
#
# Efecto: agrega digeex-types.xml a la lista que el callback RegistryUpdater
# carga después de cada database migrate (al arrancar el contenedor).

registry.metadata.load = digeex-types.xml
