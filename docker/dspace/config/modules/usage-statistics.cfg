# DELTA DIGEEX para modules/usage-statistics.cfg
#
# Este archivo NO es el usage-statistics.cfg completo. Son solo los overrides
# DIGEEX a aplicar sobre el stock de DSpace, reemplazando las líneas homónimas.

# DIGEEX: subido a 50 para que la pantalla admin de uso muestre un ranking
# significativo del repo (el default 10 queda corto cuando el catalogo crece).
# Subir mas implica mas carga en Solr al construir el ranking; 50 alcanza para
# analisis de tendencia sin penalizar el endpoint. (stock: 10)
usage-statistics.topItemsLimit = 50

# DIGEEX: ampliado a 60 meses (5 anios) para que el filtro temporal del frontend
# (dropdown "Ultimos N meses" en /administrador/uso/items y /programas) recorte
# en runtime al rango que el admin elija sin disparar otra llamada al backend.
# Reducir por debajo de este limite rompe la opcion "Ultimos 60 meses" del UI.
# (stock: -6)
usage-statistics.startDateInterval = -60
