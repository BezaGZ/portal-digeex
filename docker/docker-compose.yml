# DELTA DIGEEX para docker-compose.yml
#
# Este archivo NO es un docker-compose completo. Es solo el fragmento DIGEEX a
# aplicar sobre el docker-compose.yml stock de DSpace en el deploy. No define
# toda la infra (db, solr, redes, volumenes): eso lo trae el repo oficial.
#
# Lo único que agrega, por ahora:
#   En el servicio `dspace`, reemplazar el entrypoint inline stock por el
#   entrypoint.sh DIGEEX (docker/entrypoint.sh), que corre migrate +
#   initialize-entities + create-administrator, y exponerle al contenedor las
#   variables del admin (el script las lee del env, no por interpolacion).
#
# Posición: dentro de services.dspace, suma el bloque `environment:` (mergea con
# el stock) y sustituye el bloque `entrypoint:` stock. La interpolacion ${...}
# toma los valores de docker/.env.
# (En el dev de backend/docker-compose.yml el entrypoint hoy va inline; cuando
# se decida, se apunta tambien a este entrypoint.sh para no tener dos fuentes.)

services:
  dspace:
    environment:
      # El entrypoint corre dentro del contenedor, asi que necesita las vars en
      # el env del contenedor; Compose las interpola desde docker/.env.
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_FIRSTNAME: ${ADMIN_FIRSTNAME}
      ADMIN_LASTNAME: ${ADMIN_LASTNAME}
      ADMIN_LANGUAGE: ${ADMIN_LANGUAGE}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    volumes:
      # Montar el entrypoint DIGEEX dentro del contenedor (ajustar el path host
      # segun como quede armado el deploy).
      - ./entrypoint.sh:/dspace/entrypoint.sh:ro
    entrypoint:
      - /bin/bash
      - /dspace/entrypoint.sh
