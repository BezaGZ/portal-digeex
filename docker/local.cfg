##########################
# PORTAL DIGEEX - CONFIG #
##########################
# Overrides DIGEEX sobre dspace.cfg. Solo lo que el portal personaliza —
# el resto de la configuración default vive en /dspace/config/dspace.cfg
# dentro de la imagen base de DSpace.
#

# RN-06: Expiración de sesión JWT
# El token JWT expira después de 30 minutos (1800000 milisegundos).
# Al expirar, el usuario debe autenticarse nuevamente.
# Fuente: REST Contract authentication.md - JWT token expiration
jwt.login.token.expiration = 1800000

# Hardening de permisos de collection/community admin.
# Cierran las fugas detectadas tras el Ciclo 40 (subgroup admin): sin estas
# flags, un collection admin (incluido el delegado por herencia transitiva via
# subgroup del _admin técnico) puede manipular membership del _admin y _SUBMIT
# técnicos de su colección, crear policies sobre la coll/items y modificar
# workflows.
# Default upstream = true (permisivo). Aquí se cierran explícitamente.
# Fuente: GHSA-cf2j-vf36-c6w8 (security advisory DSpace) + auditoría
core.authorization.collection-admin.admin-group = false
core.authorization.collection-admin.submitters = false
core.authorization.collection-admin.policies = false
core.authorization.collection-admin.workflows = false
core.authorization.community-admin.policies = false
core.authorization.community-admin.collection.workflows = false
