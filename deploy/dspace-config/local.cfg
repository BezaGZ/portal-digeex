##########################
# PORTAL DIGEEX - CONFIG #
##########################
# Overrides DIGEEX sobre dspace.cfg. Solo lo que el portal personaliza —
# el resto de la configuración default vive en /dspace/config/dspace.cfg
# dentro de la imagen base de DSpace.
#

# RN-06: Expiración de sesión JWT
# El token JWT expira después de 30 minutos (1800000 milisegundos).
# Al expirar, el usuario debe autenticarse nuevamente.
# Fuente: REST Contract authentication.md - JWT token expiration
jwt.login.token.expiration = 1800000

# Expiración del token de recuperación de contraseña (flujo "forgot").
# Baja de 24H (default de dspace.cfg) a 4H para acortar la ventana en que el
# enlace de reset —una credencial temporal que viaja por correo— sigue válido.
# El valor se concatena a "PT" y se parsea como Duration ISO-8601 en
# RegistrationDataExpirationConfiguration: usar unidad (H/M), no un número solo.
# Fuente: dspace.cfg:1652 (eperson.registration-data.token.forgot.expiration).
eperson.registration-data.token.forgot.expiration = 4H

# Hardening de permisos de collection/community admin.
# Cierran las fugas detectadas tras el Ciclo 40 (subgroup admin): sin estas
# flags, un collection admin (incluido el delegado por herencia transitiva via
# subgroup del _admin técnico) puede manipular membership del _admin y _SUBMIT
# técnicos de su colección, crear policies sobre la coll/items y modificar
# workflows.
# Default upstream = true (permisivo). Aquí se cierran explícitamente.
# Fuente: GHSA-cf2j-vf36-c6w8 (security advisory DSpace) + auditoría
core.authorization.collection-admin.admin-group = false
core.authorization.collection-admin.submitters = false
core.authorization.collection-admin.policies = false
core.authorization.collection-admin.workflows = false
core.authorization.community-admin.policies = false
core.authorization.community-admin.collection.workflows = false

# Exposición del `dc.description.provenance` y `person.email` en el REST API.
# El upstream de DSpace 9 trae estas dos líneas como `true` en
# `dspace.cfg:1003-1004`, lo cual oculta los campos en TODAS las responses
# REST sin excepciones (no distingue Administrator de Anonymous). DIGEEX
# necesita el provenance accesible para alimentar el Bloque 2 del Sprint 8
# (visor del historial de items, programas y subdirecciones) y para que el
# Bloque 3 (auditoría de ediciones desde el portal) pueda re-leer las
# entradas que su `AuditTrailService` agrega al campo. El control de acceso
# por rol/scope vive en el frontend (rutas guard) y en las policies READ del
# DSO, no en este flag binario de visibilidad de metadata.
metadata.hide.dc.description.provenance = false
metadata.hide.person.email = false

# Item counter (strengths). Activa el cálculo de `archivedItemsCount`
# que DSpace expone en /api/core/collections y /communities. Sin esto,
# el campo viene como `-1` (feature off). El widget top-list-card del
# Dashboard de KPIs (Sprint 8 Ciclo 12) lo lee del listing directo y
# evita N+1 llamadas a discovery para contar items por colección.
# `cache=true` usa Solr para no recontar en cada request; se invalida
# solo al reindexar (`dspace index-discovery`).
webui.strengths.show = true
webui.strengths.cache = true

# Identidad institucional y URL del frontend.
# `dspace.name` aparece en el subject de los correos transaccionales y en
# la firma del template `change_password`. `dspace.ui.url` es la base que
# `AccountServiceImpl` usa para armar el enlace de reset que viaja en el
# correo (la pieza después del host es el path hardcoded `/forgot/{token}`).
dspace.name = Portal de Gestión del Conocimiento DIGEEX
dspace.ui.url = http://localhost:4200

# Solr Statistics — ventana del reporte mensual y tamaño del ranking.
# `startDateInterval = -60` amplía el report `TotalVisitsPerMonth` a los
# 60 últimos meses (5 años) para que el dropdown "Ventana mensual" del
# frontend pueda recortar runtime al rango que el admin elija sin volver a
# pegarle al backend. `topItemsLimit = 50` extiende el ranking global del
# Site (Top items vistos) del default 10 a 50.
usage-statistics.startDateInterval = -60
usage-statistics.topItemsLimit = 50


# Restringe a los administradores de comunidad y de colección. Por defecto
# DSpace les permite borrar items de forma permanente, gestionar las políticas
# de los items, eliminar colecciones y subcomunidades y crear grupos sueltos.
# Con estos flags en false, esas acciones quedan reservadas al administrador del
# sitio. Queda ABIERTO (default true) `community-admin.admin-group`: al crear un
# programa el admin_sub enlaza grupos con addSubgroup, y el chequeo nativo de
# DSpace ruta ese permiso por el adminGroup de la comunidad cuando los flags de
# collection-admin están cerrados (collection-facade.createColeccion$). Cerrarlo
# rompe la creación de programas (403). Default upstream = true (permisivo).
core.authorization.collection-admin.item.delete = false
core.authorization.community-admin.item.delete = false
core.authorization.collection-admin.item.policies = false
core.authorization.community-admin.item.policies = false

# Abierto (true): el rollback de createColeccion$ (saga compensatoria) borra la
# colección recién creada cuando un paso posterior falla; con la flag en false
# ese DELETE respondía 403 y el programa quedaba huérfano. El borrado manual
# sigue reservado al superadmin en la UI (canDeletePrograma); el costo asumido
# es que el admin_sub podría borrar colecciones de su sub por API (en cascada).
core.authorization.community-admin.delete-subelement = true

core.authorization.community-admin.group = false
core.authorization.item-admin.policies = false
core.authorization.community-admin.collection.policies = false

# RN-03: complejidad de contraseña también en el servidor.
# El default de la imagen (authentication-password.cfg:54) solo exige 8
# caracteres; el frontend ya exige 8 + mayúscula + número. Este patrón
# alinea el backend para que la regla no dependa de pasar por el UI:
# (?=.*[A-Z]) al menos una mayúscula, (?=.*[0-9]) al menos un número,
# .{8\,} mínimo 8 caracteres (la coma va escapada, exigencia del parser
# Apache Commons Config). RegexPasswordValidator responde 422
# (PasswordNotValidException) cuando no cumple.
# Fuente: wiki.lyrasis.org DSDOC9x Authentication Plugins, regex-validation.pattern
authentication-password.regex-validation.pattern = ^(?=.*[A-Z])(?=.*[0-9]).{8\,}$