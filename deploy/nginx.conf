# Sirve el SPA y proxea /server/ al backend, mismo origen. El HTTP redirige a
# HTTPS y el TLS lo corta este nginx con el certificado de Let's Encrypt montado
# desde el host. Cabeceras basadas en docs/05-despliegue/reverse-proxy-cabeceras.md.

server {
    listen 80;
    server_name digeex-ensayo.duckdns.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name digeex-ensayo.duckdns.org;

    ssl_certificate     /etc/letsencrypt/live/digeex-ensayo.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/digeex-ensayo.duckdns.org/privkey.pem;

    root /usr/share/nginx/html;
    index index.html;

    # Subidas grandes (PDF, fotos); el default de nginx corta en 1m.
    client_max_body_size 512m;

    # Cabeceras de seguridad (ver docs/08-mejoras/auditoria-seguridad.md 5.2).
    # Ningun location de abajo define add_header, asi estas valen para todo.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # CSP arranca en Report-Only y se pasa a enforce tras validar en runtime.
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    # HSTS se suma una vez confirmado que el HTTPS anda estable (revertirlo es lento).

    # REST de DSpace, alcanzado por la red interna.
    location /server/ {
        proxy_pass http://dspace:8080/server/;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # Subidas y operaciones largas necesitan mas que el timeout default.
        proxy_read_timeout 300s;
    }

    # El router de Angular maneja las rutas; todo lo demas cae en index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
