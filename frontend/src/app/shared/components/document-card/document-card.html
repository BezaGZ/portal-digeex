<div
  class="cursor-pointer max-w-sm mx-auto md:max-w-none md:mx-0 w-full"
  (click)="onCardClick()"
>
  <p-card
    [style]="{ overflow: 'hidden' }"
    styleClass="!rounded-2xl !border !border-gray-200 !shadow-sm hover:!shadow-lg transition-all flex flex-col h-full"
  >
    <ng-template pTemplate="header">
      @if (item().coverImage && !imageError()) {
        <div
          class="w-full aspect-[3/4] bg-[#F3F4F6] flex items-center justify-center overflow-hidden"
        >
          <img
            [src]="item().coverImage"
            [alt]="item().name"
            loading="lazy"
            (error)="onImageError()"
            class="w-full h-full object-contain"
          />
        </div>
      } @else {
        <div class="w-full aspect-[3/4] bg-[#F3F4F6] flex items-center justify-center">
          <i
            [class]="isVideo ? 'pi pi-play-circle text-4xl' : 'pi pi-file-pdf text-4xl'"
            style="color: var(--gob-competitividad)"
          ></i>
        </div>
      }
    </ng-template>
    <ng-template pTemplate="title">
      <div
        class="line-clamp-2 min-h-[3rem]"
        style="
          color: var(--gob-azul-gobierno);
          font-family: var(--font-heading);
          font-weight: 500;
          font-size: 1.125rem;
          line-height: 1.3;
        "
      >
        {{ item().name }}
      </div>
    </ng-template>
    <ng-template pTemplate="subtitle">
      <div class="flex items-center justify-between mt-2">
        @if (item().dateIssued) {
          <span
            class="text-xs"
            style="color: var(--color-text-tertiary); font-family: var(--font-body)"
          >
            {{ item().dateIssued | date: 'shortDate' }}
          </span>
        }
        @if (isVideo) {
          <p-button
            label="Ver"
            icon="pi pi-play"
            severity="primary"
            [rounded]="true"
            styleClass="!font-medium !px-6 !py-2 transition-all duration-200"
            (onClick)="onWatchVideo($event)"
          ></p-button>
        } @else {
          <p-button
            label="Descargar"
            icon="pi pi-download"
            severity="primary"
            [rounded]="true"
            [loading]="downloading()"
            [disabled]="downloading()"
            styleClass="!font-medium !px-6 !py-2 transition-all duration-200"
            (onClick)="onDownload($event)"
          ></p-button>
        }
      </div>
    </ng-template>
  </p-card>
</div>
