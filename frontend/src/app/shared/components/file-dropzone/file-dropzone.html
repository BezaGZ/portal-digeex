<p-fileupload
  #pfu
  mode="advanced"
  [chooseLabel]="chooseLabel"
  [accept]="accept"
  [multiple]="multiple"
  [auto]="false"
  [customUpload]="true"
  [showUploadButton]="false"
  [showCancelButton]="false"
  styleClass="digeex-dropzone"
  (onSelect)="onSelect($event)"
  (onRemove)="onRemove($event, pfu.files)"
  (onClear)="onClear()">

  <ng-template pTemplate="empty">
    <div class="flex flex-col items-center justify-center py-10 text-center"
         style="color: var(--color-text-secondary)">
      <i class="pi pi-cloud-upload text-5xl mb-3"
         style="color: var(--color-text-secondary); opacity: 0.7"></i>
      <p class="text-sm" style="font-family: var(--font-body)">
        {{ dropMessage }}
      </p>
    </div>
  </ng-template>

  <ng-template pTemplate="file" let-file let-index="index">
    <div class="flex items-center gap-3 px-3 py-2 border-b"
         style="border-color: var(--color-border, #e5e7eb)">
      <i [class]="iconFor(file.name)"
         class="text-2xl"
         style="color: var(--color-text-primary)"></i>
      <div class="flex flex-col flex-1 min-w-0">
        <span class="truncate text-sm"
              style="color: var(--color-text-primary); font-family: var(--font-body)">
          {{ file.name }}
        </span>
        <span class="text-xs"
              style="color: var(--color-text-secondary); font-family: var(--font-body)">
          {{ file.size | fileSize }}
        </span>
      </div>
      <p-button
        icon="pi pi-times"
        severity="danger"
        [text]="true"
        [rounded]="true"
        size="small"
        (onClick)="pfu.remove($event, index)" />
    </div>
  </ng-template>
</p-fileupload>
