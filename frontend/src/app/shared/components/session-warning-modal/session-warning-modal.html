<p-dialog
  [visible]="idleService.warningVisible()"
  [modal]="true"
  [closable]="false"
  [dismissableMask]="false"
  [draggable]="false"
  [resizable]="false"
  header="Sesión a punto de expirar"
  [style]="{ width: '420px' }">
  <div data-testid="session-warning-modal" class="flex flex-col items-center text-center gap-4 pt-2">
    <i class="pi pi-clock text-4xl text-[var(--color-warning)]"></i>
    <p class="text-sm text-gray-600 dark:text-gray-300">
      Tu sesión se cerrará automáticamente por inactividad. ¿Deseas continuar trabajando?
    </p>
  </div>

  <ng-template #footer>
    <div class="flex justify-center gap-2 w-full">
      <p-button
        label="Cerrar sesión"
        severity="danger"
        [rounded]="true"
        data-testid="btn-logout"
        (onClick)="onLogout()" />
      <p-button
        label="Seguir trabajando"
        severity="primary"
        [rounded]="true"
        data-testid="btn-continue"
        (onClick)="onContinue()" />
    </div>
  </ng-template>
</p-dialog>
