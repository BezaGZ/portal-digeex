<div class="content-browser">
  <div class="container mx-auto px-4 py-8">
    @if (isLoading) {
      <div class="max-w-[1400px] mx-auto">
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
          @for (i of [1, 2, 3, 4, 5, 6, 7, 8]; track i) {
            <app-skeleton-card />
          }
        </div>
      </div>
    } @else if (items.length > 0) {
      <div class="max-w-[1400px] mx-auto">
        <div class="mb-4">
          <p-button
            label=" Regresar"
            icon="pi pi-arrow-left"
            severity="primary"
            [rounded]="true"
            styleClass="!text-white !font-medium !px-4 !py-2 transition-all duration-200"
            (onClick)="goBack()"
          ></p-button>
        </div>

        <div class="mb-6">
          <h2
            class="mb-2"
            style="
              color: var(--gob-azul-gobierno);
              font-family: var(--font-heading);
              font-weight: 700;
            "
          >
            {{ currentNode?.name }}
          </h2>
          <p
            class="text-sm mb-2"
            style="color: var(--color-text-secondary); font-family: var(--font-body)"
          >
            {{ currentNode?.description }}
          </p>
          <p
            class="text-sm"
            style="color: var(--color-text-secondary); font-family: var(--font-body)"
          >
            {{ totalRecords }} documentos disponibles
          </p>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6 mb-6">
          @for (item of items; track item.id) {
            <app-document-card
              [item]="item"
              (cardClick)="navigateToDocument($event)"
              (download)="downloadBitstream($event)"
              (watchVideo)="openVideo($event)"
            />
          }
        </div>

       
       
          <div class="mt-6">
            <p-paginator
              [rows]="itemsPerPage"
              [totalRecords]="totalRecords"
              [first]="currentPage * itemsPerPage"
              (onPageChange)="onPageChange($event)"
            >
            </p-paginator>
          </div>
        
        
      </div>
    } @else {
      <app-empty-state
        icon="pi pi-inbox"
        title="No hay documentos"
        message="Esta colección aún no tiene documentos disponibles"
      />
    }
  </div>
</div>
