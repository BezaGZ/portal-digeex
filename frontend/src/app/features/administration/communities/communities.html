<div class="p-6">

  <div class="mb-6">
    <div class="flex flex-col items-start gap-4 sm:flex-row sm:items-center sm:justify-between">
      <div>
        <h1 class="text-3xl font-bold text-gray-800 dark:text-gray-100 mb-2">Subdirecciones</h1>
        <p class="text-gray-600 dark:text-gray-400">
          Gestión de las sub-comunidades top-level del repositorio DIGEEX.
        </p>
      </div>
      @if (canCreateTopLevel() && !loading()) {
        <p-button
          label="Nueva subdirección"
          icon="pi pi-plus"
          severity="primary"
          [rounded]="true"
          (onClick)="openCreateDialog()" />
      }
    </div>
  </div>

  @if (loading()) {
    <app-loading-spinner minHeight="240px" />
  } @else if (rootUuid() === null) {
    <p-message
      severity="warn"
      text="El repositorio no está inicializado. Pídale al administrador del sistema que ejecute el bootstrap (setup-dspace.sh)."
      [closable]="false" />
  } @else {
    <p-card class="shadow-sm">
      <app-community-table
        [items]="subdirecciones()"
        [canEdit]="true"
        [canDelete]="canCreateTopLevel()"
        [pageSize]="pageSize()"
        [totalRecords]="totalRecords()"
        (editRequest)="openEditDialog($event)"
        (deleteRequest)="onDeleteClick($event)"
        (lazyLoad)="onLazyLoad($event)" />
    </p-card>
  }

  <app-community-dialog
    [mode]="dialogMode()"
    [initialNombreCorto]="editTargetNombreCorto()"
    [initialTituloCompleto]="editTargetTituloCompleto()"
    [initialSufijo]="editTargetSufijo()"
    [initialDescription]="editTargetDescription()"
    (submitForm)="dialogMode() === 'create' ? handleCreateSubmit($event) : handleEditSubmit($event)"
    (cancelForm)="closeDialog()" />

  <app-dangerous-delete-dialog
    [visible]="deleteVisible()"
    entityKind="subdireccion"
    [entityLabel]="deleteEntityLabel()"
    [programsCount]="deleteProgramsCount()"
    [itemsCount]="deleteItemsCount()"
    [affectedTitles]="deleteTitles()"
    affectedTitlesLabel="Programas que se eliminarán"
    [loadingContent]="deleteLoading()"
    [loadError]="deleteLoadError()"
    [deleting]="deleting()"
    (confirmed)="onDeleteConfirmed()"
    (cancelled)="onDeleteCancelled()" />
</div>
