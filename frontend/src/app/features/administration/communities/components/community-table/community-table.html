<p-table
  [value]="items()"
  styleClass="p-datatable-sm"
  [lazy]="true"
  [paginator]="true"
  [rows]="pageSize()"
  [totalRecords]="totalRecords()"
  [rowsPerPageOptions]="[10, 25, 50]"
  currentPageReportTemplate="{first}–{last} de {totalRecords}"
  [showCurrentPageReport]="true"
  (onLazyLoad)="lazyLoad.emit($event)">
  <ng-template #header>
    <tr>
      <th>Nombre</th>
      <th>Identificador</th>
      <th>Programas</th>
      <th>Recursos publicados</th>
      <th class="w-44">Acciones</th>
    </tr>
  </ng-template>
  <ng-template #body let-row>
    <tr>
      <td class="font-medium">{{ row.name }}</td>
      <td class="text-gray-600 dark:text-gray-400">{{ row.handle }}</td>
      <td>{{ row.programasCount ?? '—' }}</td>
      <td>{{ row.recursosCount ?? '—' }}</td>
      <td class="flex gap-2">
        @if (canEdit()) {
          <p-button
            icon="pi pi-pencil"
            severity="info"
            size="small"
            [rounded]="true"
            [text]="true"
            (onClick)="editRequest.emit(row)" />
        }
        @if (canDelete()) {
          <p-button
            icon="pi pi-trash"
            severity="danger"
            size="small"
            [rounded]="true"
            [text]="true"
            (onClick)="deleteRequest.emit(row)" />
        }
      </td>
    </tr>
  </ng-template>
  <ng-template #emptymessage>
    <tr>
      <td colspan="5" class="text-center text-gray-500 dark:text-gray-400 py-6">
        No hay subdirecciones registradas todavía.
      </td>
    </tr>
  </ng-template>
</p-table>
