@if (items().length === 0) {
  <app-empty-state
    icon="pi pi-sitemap"
    title="Sin subdirecciones"
    message="No hay subdirecciones registradas todavía." />
} @else {
  <p-table
    [value]="items()"
    styleClass="p-datatable-sm"
    [lazy]="true"
    [paginator]="true"
    [rows]="pageSize()"
    [totalRecords]="totalRecords()"
    [rowsPerPageOptions]="[10, 25, 50]"
    currentPageReportTemplate="{first}–{last} de {totalRecords}"
    [showCurrentPageReport]="true"
    (onLazyLoad)="lazyLoad.emit($event)">
    <ng-template #header>
      <tr>
        <th class="w-56">Nombre corto</th>
        <th>Título completo</th>
        <th>Identificador</th>
        <th>Programas</th>
        <th>Recursos publicados</th>
        <th class="w-44">Acciones</th>
      </tr>
    </ng-template>
    <ng-template #body let-row>
      <tr>
        <td class="font-bold">{{ getNombreCorto(row) }}</td>
        <td class="font-medium">{{ getTituloCompleto(row) }}</td>
        <td class="text-gray-600 dark:text-gray-400">{{ row.handle }}</td>
        <td>{{ row.programasCount ?? '—' }}</td>
        <td>{{ row.recursosCount ?? '—' }}</td>
        <td>
          <div class="flex gap-2">
            <p-button
              icon="pi pi-history"
              severity="secondary"
              size="small"
              [rounded]="true"
              [text]="true"
              pTooltip="Ver historial"
              tooltipPosition="top"
              data-testid="subdireccion-view-history"
              [routerLink]="['/administrador/historial/subdirecciones', row.uuid]" />
            @if (canEdit()) {
              <p-button
                icon="pi pi-pencil"
                severity="info"
                size="small"
                [rounded]="true"
                [text]="true"
                (onClick)="editRequest.emit(row)" />
            }
            @if (canDelete()) {
              <p-button
                icon="pi pi-trash"
                severity="danger"
                size="small"
                [rounded]="true"
                [text]="true"
                (onClick)="deleteRequest.emit(row)" />
            }
          </div>
        </td>
      </tr>
    </ng-template>
  </p-table>
}
