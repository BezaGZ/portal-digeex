<div class="p-6">
  <div class="text-2xl font-semibold text-gray-800 dark:text-gray-100 mb-4">Actualización del perfil</div>

  <p-card styleClass="mb-6">
    <div class="text-lg font-semibold text-gray-800 dark:text-gray-100 mb-4">Identidad</div>
    <div class="flex flex-col gap-4">
      <div class="flex flex-col gap-1">
        <label class="text-sm font-semibold text-gray-700 dark:text-gray-300">Dirección de correo electrónico</label>
        <input pInputText class="w-full" [(ngModel)]="email" name="email" disabled />
      </div>

      <div class="flex flex-col gap-1">
        <label class="text-sm font-semibold text-gray-700 dark:text-gray-300">Nombre *</label>
        <input pInputText class="w-full" [(ngModel)]="firstName" name="firstName" required />
      </div>

      <div class="flex flex-col gap-1">
        <label class="text-sm font-semibold text-gray-700 dark:text-gray-300">Apellidos *</label>
        <input pInputText class="w-full" [(ngModel)]="lastName" name="lastName" required />
      </div>
    </div>
  </p-card>

  <p-card styleClass="mb-6">
    <div class="text-lg font-semibold text-gray-800 dark:text-gray-100 mb-4">Seguridad</div>
    <div class="flex flex-col gap-4">
      <p-message
        severity="info"
        text="Opcionalmente, puede introducir una nueva contraseña en el cuadro a continuación y confirmarla escribiéndola nuevamente en el segundo cuadro."
        styleClass="w-full" />

      <div class="flex flex-col gap-1">
        <label class="text-sm font-semibold text-gray-700 dark:text-gray-300">Contraseña actual *</label>
        <p-password
          [(ngModel)]="currentPassword"
          (ngModelChange)="onPasswordFieldChange()"
          name="currentPassword"
          [feedback]="false"
          [toggleMask]="true"
          styleClass="w-full"
          inputStyleClass="w-full"
          required
        />
      </div>

      <div class="flex flex-col gap-1">
        <label class="text-sm font-semibold text-gray-700 dark:text-gray-300">Contraseña</label>
        <p-password
          [(ngModel)]="newPassword"
          (ngModelChange)="onPasswordFieldChange()"
          name="newPassword"
          [feedback]="false"
          [toggleMask]="true"
          styleClass="w-full"
          inputStyleClass="w-full"
        />
      </div>

      <div class="flex flex-col gap-1">
        <label class="text-sm font-semibold text-gray-700 dark:text-gray-300">Reescriba para confirmar</label>
        <p-password
          [(ngModel)]="confirmPassword"
          (ngModelChange)="onPasswordFieldChange()"
          name="confirmPassword"
          [feedback]="false"
          [toggleMask]="true"
          styleClass="w-full"
          inputStyleClass="w-full"
        />
      </div>

      @if (passwordValidationError(); as error) {
        <p-message severity="error" [text]="error" styleClass="w-full" />
      }
    </div>
  </p-card>

  <div class="flex justify-end">
    <p-button
      label="Guardar"
      icon="pi pi-save"
      severity="primary"
      (onClick)="onSave()"
      [rounded]="true"
    ></p-button>
  </div>
</div>
