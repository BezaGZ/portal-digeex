@if (loading()) {
  <app-loading-spinner />
} @else if (failed()) {
  <div
    data-testid="programa-detail-failed"
    class="container mx-auto px-4 py-8 text-center"
  >
    <p style="color: var(--color-text-secondary); font-family: var(--font-body);">—</p>
  </div>
} @else {
  <div class="container mx-auto px-4 py-8">
    <div class="max-w-5xl">
      <div class="mb-4">
        <p-button
          label=" Regresar"
          icon="pi pi-arrow-left"
          severity="primary"
          [rounded]="true"
          styleClass="!text-white !font-medium !px-4 !py-2 transition-all duration-200"
          (onClick)="goBack()" />
      </div>

      <p-card data-testid="programa-detail-card" styleClass="mb-6 shadow-sm">
        <div class="flex items-start gap-4">
          @if (logoUrl()) {
            <img
              [src]="logoUrl()"
              [alt]="title()"
              data-testid="programa-detail-logo"
              class="w-20 h-20 object-cover rounded-lg shadow-sm"
            />
          }
          <div class="flex-1">
            <div class="flex items-start justify-between gap-3">
              <h2
                class="m-0 text-3xl"
                style="
                  color: var(--gob-azul-gobierno);
                  font-family: var(--font-heading);
                  font-weight: 700;
                  line-height: 1.3;
                "
              >
                {{ title() }}
              </h2>
              @if (sigla()) {
                <span
                  class="px-3 py-1 rounded-full text-xs"
                  style="
                    background-color: var(--gob-celeste-cielo);
                    color: var(--gob-azul-gobierno);
                    font-family: var(--font-heading);
                    font-weight: 500;
                  "
                >
                  {{ sigla() }}
                </span>
              }
            </div>
            @if (description()) {
              <p
                class="mt-3"
                style="
                  color: var(--color-text-secondary);
                  font-family: var(--font-body);
                  line-height: 1.8;
                "
              >
                {{ description() }}
              </p>
            }
          </div>
        </div>
      </p-card>

      <p-card styleClass="shadow-sm">
        <h3
          class="m-0 mb-4 text-sm uppercase tracking-wide"
          style="
            color: var(--color-text-secondary);
            font-family: var(--font-heading);
            font-weight: 500;
          "
        >
          Historial de actividad
        </h3>
        <app-provenance-timeline [entries]="provenanceEntries()" />
      </p-card>
    </div>
  </div>
}
