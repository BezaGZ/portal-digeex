<p-card class="block w-full h-full" styleClass="h-full shadow-sm">
  <h3 class="m-0 mb-4 text-base font-semibold !text-gray-800 dark:!text-gray-100">
    {{ heading() }}
  </h3>

  @if (loading()) {
    <app-loading-spinner data-testid="usage-report-loading" minHeight="160px" />
  } @else if (!hasData()) {
    <app-empty-state
      data-testid="usage-report-empty"
      icon="pi pi-chart-bar"
      title="Sin datos registrados"
      message="Aún no se han registrado datos para este reporte." />
  } @else {
    <p-table
      [value]="report()!.points"
      styleClass="p-datatable-sm w-full">
      <ng-template #header>
        <tr>
          <th>Etiqueta</th>
          <th class="text-right w-20 whitespace-nowrap">Total</th>
        </tr>
      </ng-template>
      <ng-template #body let-point>
        <tr data-testid="usage-report-row">
          <td class="break-words">{{ point.label }}</td>
          <td class="text-right font-medium whitespace-nowrap">
            {{ valueOf(point) | number: '1.0-0' }}
          </td>
        </tr>
      </ng-template>
    </p-table>
  }
</p-card>
