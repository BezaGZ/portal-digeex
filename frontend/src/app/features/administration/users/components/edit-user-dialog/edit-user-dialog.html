<p-dialog
  [header]="'Editar Usuario'"
  [visible]="visible()"
  [modal]="true"
  [closable]="false"
  (onHide)="onHide()"
  [draggable]="false"
  [resizable]="false"
>
  <form [formGroup]="form" (ngSubmit)="onSubmit()">
    @if (errorMessage()) {
      <p-message severity="error" [text]="errorMessage()!" styleClass="w-full mb-4" />
    }

    <div class="form-field">
      <p-floatLabel>
        <input
          pInputText
          id="edit-email"
          formControlName="email"
          type="email"
          class="w-full"
          [class.ng-invalid]="hasError('email')"
          [class.ng-dirty]="hasError('email')"
        />
        <label for="edit-email">Correo electrónico *</label>
      </p-floatLabel>
      @if (hasError('email')) {
        <small style="color: var(--color-error)">{{ getErrorMessage('email') }}</small>
      }
      @if (!hasError('email')) {
        <small style="color: var(--color-text-tertiary)">Debe terminar en {{ allowedDomains.join(', ') }}</small>
      }
    </div>

    <div class="form-field">
      <p-floatLabel>
        <input
          pInputText
          id="edit-firstName"
          formControlName="firstName"
          class="w-full"
          [class.ng-invalid]="hasError('firstName')"
          [class.ng-dirty]="hasError('firstName')"
        />
        <label for="edit-firstName">Nombre *</label>
      </p-floatLabel>
      @if (hasError('firstName')) {
        <small style="color: var(--color-error)">{{ getErrorMessage('firstName') }}</small>
      }
    </div>

    <div class="form-field">
      <p-floatLabel>
        <input
          pInputText
          id="edit-lastName"
          formControlName="lastName"
          class="w-full"
          [class.ng-invalid]="hasError('lastName')"
          [class.ng-dirty]="hasError('lastName')"
        />
        <label for="edit-lastName">Apellido *</label>
      </p-floatLabel>
      @if (hasError('lastName')) {
        <small style="color: var(--color-error)">{{ getErrorMessage('lastName') }}</small>
      }
    </div>
  </form>

  <ng-template #footer>
    <p-button
      label="Cancelar"
      severity="secondary"
      styleClass="!font-medium"
      (onClick)="onHide()"
      [text]="true"
      [rounded]="true"
    />
    <p-button
      label="Guardar cambios"
      severity="primary"
      styleClass="!text-white !font-medium"
      (onClick)="onSubmit()"
      [disabled]="!canSubmit()"
      [rounded]="true"
    />
  </ng-template>
</p-dialog>
