<div class="p-6">
  <p-toast position="top-right" />

  <app-user-table
    [users]="visibleUsers()"
    [currentUser]="currentUser()"
    (createUserRequested)="onCreateUserRequested()"
    (deactivateRequested)="onDeactivateRequested($event)"
    (reactivateRequested)="onReactivateRequested($event)"
    (resetPasswordRequested)="onResetPasswordRequested($event)"
    (modifyRoleRequested)="onModifyRoleRequested($event)"
  />

  @if (showCreateDialog()) {
    <app-user-dialog
      [visible]="showCreateDialog()"
      [caller]="currentUser()"
      [assignableGroups]="assignableGroups()"
      (visibleChange)="onDialogClosed()"
      (createSubmitted)="onCreateSubmitted($event)"
    />
  }

  @if (showChangeRoleDialog()) {
    <app-change-role-dialog
      [visible]="showChangeRoleDialog()"
      [target]="changeRoleTarget()"
      [assignableGroups]="assignableGroups()"
      (visibleChange)="onChangeRoleDialogClosed()"
      (changeSubmitted)="onChangeRoleSubmitted($event)"
    />
  }
</div>
