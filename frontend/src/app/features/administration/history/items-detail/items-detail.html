@if (loading()) {
  <app-loading-spinner />
} @else if (failed()) {
  <div class="container mx-auto px-4 py-8">
    <app-empty-state
      icon="pi pi-exclamation-triangle"
      title="No se pudo cargar el ítem"
      message="El recurso no existe o hubo un problema al cargarlo."
      testId="item-detail-failed" />
  </div>
} @else {
  <div class="container mx-auto px-4 py-8">
    <div class="max-w-7xl">
      <div class="mb-4">
        <p-button
          label="Regresar"
          icon="pi pi-arrow-left"
          severity="primary"
          [rounded]="true"
          (onClick)="goBack()" />
      </div>

      <p-card data-testid="item-detail-card" styleClass="mb-6 shadow-sm">
        <h2 class="m-0 text-3xl font-bold text-gray-800 dark:text-gray-100 leading-tight">
          {{ title() }}
        </h2>
        <div class="mt-4 flex flex-wrap gap-3 text-sm">
          @if (author()) {
            <span class="text-gray-600 dark:text-gray-400">
              <strong class="text-gray-800 dark:text-gray-100 font-medium">Autor:</strong>
              {{ author() }}
            </span>
          }
          @if (entityType()) {
            <span
              class="px-3 py-1 rounded-full text-xs font-medium bg-emerald-100 text-emerald-700 dark:bg-emerald-900 dark:text-emerald-200"
            >
              {{ entityType() }}
            </span>
          }
        </div>
      </p-card>

      <p-card styleClass="shadow-sm">
        <div class="flex items-center justify-between mb-4 gap-3">
          <h3 class="m-0 text-sm uppercase tracking-wide font-medium text-gray-600 dark:text-gray-300">
            Historial de actividad
          </h3>
          <app-export-history-button
            [dsoTitle]="title()"
            [dsoSubtitle]="author()"
            dsoType="item"
            [entries]="provenanceEntries()"
            [handle]="item()?.handle"
            [uuid]="item()?.uuid" />
        </div>
        <app-provenance-timeline [entries]="provenanceEntries()" />
      </p-card>
    </div>
  </div>
}
