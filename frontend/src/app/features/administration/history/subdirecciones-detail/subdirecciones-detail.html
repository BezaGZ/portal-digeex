@if (loading()) {
  <app-loading-spinner />
} @else if (failed()) {
  <div class="container mx-auto px-4 py-8">
    <app-empty-state
      icon="pi pi-exclamation-triangle"
      title="No se pudo cargar la subdirección"
      message="El recurso no existe o hubo un problema al cargarlo."
      testId="subdireccion-detail-failed" />
  </div>
} @else {
  <div class="container mx-auto px-4 py-8">
    <div class="max-w-7xl">
      <div class="mb-4">
        <p-button
          label="Regresar"
          icon="pi pi-arrow-left"
          severity="primary"
          [rounded]="true"
          (onClick)="goBack()" />
      </div>

      <p-card data-testid="subdireccion-detail-card" styleClass="mb-6 shadow-sm">
        <div class="flex items-start justify-between gap-3">
          <h2 class="m-0 text-3xl font-bold text-gray-800 dark:text-gray-100 leading-tight">
            {{ title() }}
          </h2>
          @if (sufijo()) {
            <span
              class="px-3 py-1 rounded-full text-xs font-medium bg-emerald-100 text-emerald-700 dark:bg-emerald-900 dark:text-emerald-200"
            >
              {{ sufijo() }}
            </span>
          }
        </div>
        @if (description()) {
          <p class="mt-3 text-gray-600 dark:text-gray-400 leading-relaxed">
            {{ description() }}
          </p>
        }
      </p-card>

      <p-card styleClass="shadow-sm">
        <div class="flex items-center justify-between mb-4 gap-3">
          <h3 class="m-0 text-sm uppercase tracking-wide font-medium text-gray-600 dark:text-gray-300">
            Historial de actividad
          </h3>
          <app-export-history-button
            [dsoTitle]="title()"
            [dsoSubtitle]="sufijo()"
            [dsoDescription]="description()"
            dsoType="subdireccion"
            [entries]="provenanceEntries()"
            [handle]="community()?.handle"
            [uuid]="community()?.uuid" />
        </div>
        <app-provenance-timeline [entries]="provenanceEntries()" />
      </p-card>
    </div>
  </div>
}
