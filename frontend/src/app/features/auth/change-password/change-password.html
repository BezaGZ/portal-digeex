<div class="min-h-screen flex items-center justify-center bg-[#F5F7FA] p-4">
  <div class="w-full max-w-md">
    <p-card>
      <div class="text-center mb-6">
        <img src="/logo-side.png" alt="Logo DIGEEX" class="h-16 mx-auto mb-4" />
        <p class="text-gray-600 text-lg">Cambiar contraseña</p>
      </div>

      <form (ngSubmit)="onSubmit()" class="space-y-5">
        <div>
          <label for="currentPassword" class="block text-sm font-medium text-gray-700 mb-2">
            <i class="pi pi-lock mr-2"></i>Contraseña actual
          </label>
          <p-password
            [(ngModel)]="currentPassword"
            name="currentPassword"
            [feedback]="false"
            [toggleMask]="true"
            placeholder="••••••••"
            styleClass="w-full"
            inputStyleClass="w-full"
            required
          />
        </div>

        <div>
          <label for="newPassword" class="block text-sm font-medium text-gray-700 mb-2">
            <i class="pi pi-lock mr-2"></i>Nueva contraseña
          </label>
          <p-password
            [(ngModel)]="newPassword"
            name="newPassword"
            [feedback]="true"
            [toggleMask]="true"
            promptLabel="Ingrese una contraseña"
            weakLabel="Débil"
            mediumLabel="Media"
            strongLabel="Fuerte"
            placeholder="••••••••"
            styleClass="w-full"
            inputStyleClass="w-full"
            required
          />
        </div>

        <div>
          <label for="confirmPassword" class="block text-sm font-medium text-gray-700 mb-2">
            <i class="pi pi-lock mr-2"></i>Confirmar contraseña
          </label>
          <p-password
            [(ngModel)]="confirmPassword"
            name="confirmPassword"
            [feedback]="false"
            [toggleMask]="true"
            placeholder="••••••••"
            styleClass="w-full"
            inputStyleClass="w-full"
            required
          />
        </div>

        @if (errorMessage) {
          <div
            class="text-sm rounded-lg px-3 py-2"
            style="
              color: var(--color-error);
              background-color: var(--gob-competitividad-light);
              border: 1px solid var(--color-error);
            "
          >
            {{ errorMessage }}
          </div>
        }

        <div class="flex flex-col gap-4 pt-2">
          <p-button
            type="submit"
            label="Guardar"
            icon="pi pi-check"
            styleClass="w-full !text-white !font-medium"
            severity="primary"
            [rounded]="true"
          />

          <p-button
            type="button"
            label="Volver al inicio"
            icon="pi pi-arrow-left"
            styleClass="w-full !font-medium"
            severity="secondary"
            [outlined]="true"
            [rounded]="true"
            (onClick)="goToHome()"
          />
        </div>
      </form>
    </p-card>

    <div class="text-center mt-6">
      <p class="text-sm text-gray-600">Ministerio de Educación — Guatemala</p>
    </div>
  </div>
</div>
