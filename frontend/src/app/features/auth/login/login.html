<div class="min-h-screen flex items-center justify-center bg-[var(--color-background)] p-4">
  <div class="w-full max-w-md">
    <p-card>
      <div class="text-center mb-6">
        <img src="/logo-side.png" alt="Logo DIGEEX" class="h-16 mx-auto mb-4" />
        <h1
          class="
            text-xl
            font-bold
            text-[var(--color-text-primary)]
            font-[var(--font-display)]
            tracking-tight
            leading-tight
            mb-1
          "
        >
          Inicio de Sesión
        </h1>
        <p class="text-lg text-[var(--color-text-secondary)]">
          Portal de Gestión del Conocimiento DIGEEX
        </p>
      </div>

      <form (ngSubmit)="onLogin()" class="space-y-5">
        <div>
          <label
            for="email"
            class="
              block
              text-sm
              font-medium
              text-[var(--color-text-secondary)]
              mb-2
            "
          >
            <i class="pi pi-envelope mr-2"></i>Correo electrónico
          </label>
          <input
            pInputText
            id="email"
            type="email"
            [(ngModel)]="email"
            name="email"
            placeholder="usuario@mineduc.gob.gt"
            class="w-full"
            required
          />
        </div>

        <div>
          <label
            for="password"
            class="
              block
              text-sm
              font-medium
              text-[var(--color-text-secondary)]
              mb-2
            "
          >
            <i class="pi pi-lock mr-2"></i>Contraseña
          </label>
          <p-password
            [(ngModel)]="password"
            name="password"
            [feedback]="false"
            [toggleMask]="true"
            placeholder="••••••••"
            styleClass="w-full"
            inputStyleClass="w-full"
            required
          />
        </div>

        @if (errorMessage()) {
          <div
            class="
              text-sm
              rounded-lg
              px-3
              py-2
              text-[var(--color-error)]
              bg-[var(--gob-competitividad-light)]
              border
              border-[var(--color-error)]
            "
          >
            {{ errorMessage() }}
          </div>
        }

        <div class="flex flex-col gap-4 pt-2">
          <p-button
            type="submit"
            label="Iniciar Sesión"
            icon="pi pi-sign-in"
            styleClass="w-full !text-white !font-medium"
            severity="primary"
            [rounded]="true"
            [loading]="isLoading()"
            [disabled]="isLoading()"
          />

          <p-button
            type="button"
            label="Volver al Inicio"
            icon="pi pi-arrow-left"
            styleClass="w-full !font-medium"
            severity="secondary"
            [outlined]="true"
            [rounded]="true"
            (onClick)="goToHome()"
          />
        </div>

        <div class="text-center pt-1">
          <a
            href="#"
            class="
              text-sm
              text-[var(--color-primary)]
              hover:underline
            "
          >
            ¿Olvidaste tu contraseña?
          </a>
        </div>
      </form>
    </p-card>

    <div class="text-center mt-6">
      <p class="text-sm text-[var(--color-text-tertiary)]">
        Ministerio de Educación — Guatemala
      </p>
    </div>
  </div>
</div>
