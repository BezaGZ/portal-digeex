<div class="min-h-screen flex items-center justify-center bg-[#F5F7FA] p-4">
  <div class="w-full max-w-md">
    <p-card>
      <div class="text-center mb-6">
        <img src="/logo-side.png" alt="Logo DIGEEX" class="h-16 mx-auto mb-4" />
        <p class="text-gray-600 text-lg">Portal de Gestión del Conocimiento</p>
      </div>

      <form (ngSubmit)="onLogin()" class="space-y-5">
        <div>
          <label for="email" class="block text-sm font-medium text-gray-700 mb-2">
            <i class="pi pi-envelope mr-2"></i>Correo electrónico
          </label>
          <input
            pInputText
            id="email"
            type="email"
            [(ngModel)]="email"
            name="email"
            placeholder="usuario@mineduc.gob.gt"
            class="w-full"
            required
          />
        </div>

        <div>
          <label for="password" class="block text-sm font-medium text-gray-700 mb-2">
            <i class="pi pi-lock mr-2"></i>Contraseña
          </label>
          <p-password
            [(ngModel)]="password"
            name="password"
            [feedback]="false"
            [toggleMask]="true"
            placeholder="••••••••"
            styleClass="w-full"
            inputStyleClass="w-full"
            required
          />
        </div>

        <div class="flex flex-col gap-4 pt-2">
          <p-button
            type="submit"
            label="Iniciar Sesión"
            icon="pi pi-sign-in"
            styleClass="w-full !text-white !font-medium"
            severity="primary"
            [rounded]="true"
          />

          <p-button
            type="button"
            label="Volver al Inicio"
            icon="pi pi-arrow-left"
            styleClass="w-full !font-medium"
            severity="secondary"
            [outlined]="true"
            [rounded]="true"
            (onClick)="goToHome()"
          />
        </div>
      </form>
    </p-card>

    <div class="text-center mt-6">
      <p class="text-sm text-gray-600">Ministerio de Educación — Guatemala</p>
    </div>
  </div>
</div>
