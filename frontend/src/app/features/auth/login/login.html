<app-auth-card-shell title="Inicio de Sesión">
  <form (ngSubmit)="onLogin()" class="space-y-5">
    <div>
      <label
        for="email"
        class="
          block
          text-sm
          font-medium
          text-[var(--color-text-secondary)]
          mb-2
        "
      >
        <i class="pi pi-envelope mr-2"></i>Correo electrónico
      </label>
      <input
        pInputText
        id="email"
        type="email"
        [(ngModel)]="email"
        name="email"
        placeholder="usuario&#64;mineduc.gob.gt"
        class="w-full"
        required
      />
    </div>

    <div>
      <label
        for="password"
        class="
          block
          text-sm
          font-medium
          text-[var(--color-text-secondary)]
          mb-2
        "
      >
        <i class="pi pi-lock mr-2"></i>Contraseña
      </label>
      <p-password
        [(ngModel)]="password"
        name="password"
        [feedback]="false"
        [toggleMask]="true"
        placeholder="••••••••"
        styleClass="w-full"
        inputStyleClass="w-full"
        required
      />
    </div>

    @if (errorMessage()) {
      <div
        class="
          text-sm
          rounded-lg
          px-3
          py-2
          text-[var(--color-error)]
          bg-[var(--gob-competitividad-light)]
          border
          border-[var(--color-error)]
        "
      >
        {{ errorMessage() }}
      </div>
    }

    <div class="flex flex-col gap-4 pt-2">
      <p-button
        type="submit"
        label="Iniciar Sesión"
        icon="pi pi-sign-in"
        styleClass="w-full !text-white !font-medium"
        severity="primary"
        [rounded]="true"
        [loading]="isLoading()"
        [disabled]="isLoading()"
      />

      <p-button
        type="button"
        label="Volver al Inicio"
        icon="pi pi-arrow-left"
        styleClass="w-full !font-medium"
        severity="secondary"
        [outlined]="true"
        [rounded]="true"
        (onClick)="goToHome()"
      />
    </div>

    <div class="text-center pt-1">
      <a
        [routerLink]="['/restablecer-contrasena']"
        class="
          text-sm
          text-[var(--color-primary)]
          hover:underline
        "
      >
        ¿Olvidaste tu contraseña?
      </a>
    </div>
  </form>
</app-auth-card-shell>
