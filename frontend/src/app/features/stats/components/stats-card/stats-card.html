<p-card
  styleClass="h-full hover:shadow-lg transition-shadow cursor-pointer digeex-stats-card"
  (click)="emitOpen()">
  <div class="relative flex flex-col items-center text-center gap-2 px-2 py-3">
    @if (item.abstract) {
      <button
        type="button"
        class="absolute top-0 right-0 p-1.5 rounded-full transition-colors"
        style="color: var(--gob-azul-gobierno)"
        aria-label="Ver descripción completa"
        (click)="openInfo($event)">
        <i class="pi pi-info-circle text-base"></i>
      </button>
    }

    <div class="flex items-center justify-center w-14 h-14 rounded-full"
         style="background-color: var(--gob-celeste-cielo); color: var(--gob-azul-gobierno)">
      <i class="pi pi-chart-line text-2xl"></i>
    </div>

    <h3 class="text-base sm:text-lg font-semibold leading-tight line-clamp-2"
        style="color: var(--color-text-primary); font-family: var(--font-heading)">
      {{ item.title }}
    </h3>

    @if (item.abstract) {
      <p class="text-xs sm:text-sm leading-snug line-clamp-3"
         style="color: var(--color-text-secondary); font-family: var(--font-body)">
        {{ item.abstract }}
      </p>
    }

    <div class="flex items-center gap-1.5 text-xs mt-0.5"
         style="color: var(--color-text-secondary)">
      <i class="pi pi-calendar text-xs"></i>
      <span>{{ (item.issued | isoDateLocal) || 'Sin fecha' }}</span>
    </div>

    <p-button
      type="button"
      label="Ver"
      icon="pi pi-arrow-right"
      iconPos="right"
      severity="primary"
      size="small"
      [rounded]="true"
      styleClass="mt-2"
      (onClick)="emitOpen()" />
  </div>
</p-card>

<p-dialog
  [visible]="showInfoDialog()"
  (visibleChange)="$event ? null : closeInfo()"
  [modal]="true"
  [dismissableMask]="true"
  [closable]="true"
  [draggable]="false"
  [resizable]="false"
  [style]="{ width: '90vw', maxWidth: '32rem' }"
  [header]="item.title">
  <div class="flex flex-col gap-3 py-2">
    @if (item.abstract) {
      <p class="text-sm leading-relaxed"
         style="color: var(--color-text-primary); font-family: var(--font-body)">
        {{ item.abstract }}
      </p>
    }

    <div class="flex items-center gap-2 text-sm"
         style="color: var(--color-text-secondary)">
      <i class="pi pi-calendar"></i>
      <span>{{ (item.issued | isoDateLocal) || 'Sin fecha' }}</span>
    </div>
  </div>

  <ng-template pTemplate="footer">
    <p-button
      type="button"
      label="Cerrar"
      icon="pi pi-times"
      severity="secondary"
      [outlined]="true"
      [rounded]="true"
      (onClick)="closeInfo()" />
    <p-button
      type="button"
      label="Ver"
      icon="pi pi-arrow-right"
      iconPos="right"
      severity="primary"
      [rounded]="true"
      (onClick)="closeInfo(); emitOpen()" />
  </ng-template>
</p-dialog>
