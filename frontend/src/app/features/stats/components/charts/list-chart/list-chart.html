<div class="flex flex-col gap-2">
  @if (items().length === 0) {
    <p class="text-sm text-center italic py-4"
       style="color: var(--color-text-secondary)">
      Sin registros para mostrar.
    </p>
  } @else {
    <ul class="flex flex-col rounded-md border divide-y"
        style="border-color: var(--gob-celeste-cielo)">
      @for (item of items(); track item.label) {
        <li class="px-3 py-2 text-sm leading-snug"
            style="color: var(--color-text-primary); font-family: var(--font-body)">
          {{ item.label }}
        </li>
      }
    </ul>
  }
</div>
