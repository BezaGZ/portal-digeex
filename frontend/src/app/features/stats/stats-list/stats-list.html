<section class="max-w-7xl mx-auto px-4 py-8 flex flex-col gap-6">
  <div>
    <p-button
      label=" Regresar"
      icon="pi pi-arrow-left"
      severity="primary"
      [rounded]="true"
      styleClass="!text-white !font-medium !px-4 !py-2 transition-all duration-200"
      (onClick)="goBack()"
    ></p-button>
  </div>

  <header class="flex flex-col gap-2">
    <h1 class="text-3xl font-bold text-gray-800 dark:text-gray-100">
      Estadística
    </h1>
    <p class="text-sm text-gray-600 dark:text-gray-400">
      Dashboards interactivos con los datos abiertos publicados por DIGEEX.
      Hacé clic en una card para abrir su tablero.
    </p>
  </header>

  @if (isLoading()) {
    <app-loading-spinner minHeight="320px" />
  } @else if (items().length === 0) {
    <app-empty-state
      icon="pi pi-inbox"
      title="No hay estadísticas publicadas"
      message="Cuando DIGEEX publique nuevos dashboards van a aparecer en esta lista." />
  } @else {
    <div class="flex items-center justify-between">
      <span class="text-sm text-gray-500 dark:text-gray-400">
        {{ totalRecords() }} dataset(s) publicado(s)
      </span>
    </div>

    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-3 sm:gap-4">
      @for (item of items(); track item.uuid) {
        <app-stats-card [item]="item" (open)="openItem($event)" />
      }
    </div>

    <p-paginator
      [rows]="pageSize"
      [totalRecords]="totalRecords()"
      [first]="currentPage() * pageSize"
      (onPageChange)="onPageChange($event)"
      styleClass="justify-center" />
  }
</section>
