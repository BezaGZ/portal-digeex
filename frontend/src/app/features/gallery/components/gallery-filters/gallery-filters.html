<div class="bg-[var(--color-surface)] rounded-xl p-6 shadow-sm border border-[var(--color-border)] mb-6">
  <div class="flex items-center gap-2 mb-6 pb-4 border-b border-[var(--color-border)]">
    <i class="pi pi-filter text-lg text-[var(--color-text-primary)]"></i>
    <h3 class="text-lg font-semibold m-0 text-[var(--color-text-primary)]" style="font-family: var(--font-heading)">
      Filtrar por
    </h3>
  </div>

  <div class="mb-4">
    <label
      for="searchQuery"
      class="block text-sm font-medium mb-2"
      style="color: var(--color-text-primary); font-family: var(--font-body)"
    >
      Buscar
    </label>
    <span class="p-input-icon-left w-full">
      <i class="pi pi-search"></i>
      <input
        type="text"
        pInputText
        id="searchQuery"
        [(ngModel)]="searchQuery"
        placeholder="Buscar por título o descripción..."
        (input)="onFilterChange()"
        class="w-full"
      />
    </span>
  </div>

  <div class="mb-4">
    <label
      for="program"
      class="block text-sm font-medium mb-2"
      style="color: var(--color-text-primary); font-family: var(--font-body)"
    >
      Programa
    </label>
    <!-- Con appendTo: inline en iOS Safari estira la página por los nombres
         largos de programas. El panel flota y se topa al viewport con
         .digeex-programa-panel, sin salirse ni ensanchar el documento. -->
    <p-select
      id="program"
      [options]="programOptions"
      [(ngModel)]="selectedProgram"
      optionLabel="label"
      optionValue="value"
      placeholder="Todos los programas"
      [showClear]="true"
      appendTo="body"
      panelStyleClass="digeex-programa-panel"
      (onShow)="onProgramShow()"
      (onChange)="onFilterChange()"
      class="w-full"
    />
  </div>

  <div class="mb-4">
    <label
      for="eventType"
      class="block text-sm font-medium mb-2"
      style="color: var(--color-text-primary); font-family: var(--font-body)"
    >
      Tipo de Evento
    </label>
    <p-select
      id="eventType"
      [options]="eventTypeOptions"
      [(ngModel)]="selectedEventType"
      optionLabel="label"
      optionValue="value"
      placeholder="Todos los tipos"
      [showClear]="true"
      appendTo="body"
      (onChange)="onFilterChange()"
      class="w-full"
    />
  </div>

  <div class="mb-4">
    <label
      for="populationType"
      class="block text-sm font-medium mb-2"
      style="color: var(--color-text-primary); font-family: var(--font-body)"
    >
      Tipo de Población
    </label>
    <p-select
      id="populationType"
      [options]="populationTypeOptions"
      [(ngModel)]="selectedPopulationType"
      optionLabel="label"
      optionValue="value"
      placeholder="Todas las poblaciones"
      [showClear]="true"
      appendTo="body"
      (onChange)="onFilterChange()"
      class="w-full"
    />
  </div>

  <div class="mb-4">
    <label
      for="imageContext"
      class="block text-sm font-medium mb-2"
      style="color: var(--color-text-primary); font-family: var(--font-body)"
    >
      Enfoque de Imagen
    </label>
    <p-select
      id="imageContext"
      [options]="imageContextOptions"
      [(ngModel)]="selectedImageContext"
      optionLabel="label"
      optionValue="value"
      placeholder="Todos los enfoques"
      [showClear]="true"
      appendTo="body"
      (onChange)="onFilterChange()"
      class="w-full"
    />
  </div>

  <div class="pt-4 border-t border-[var(--color-border)]">
    <p-button
      label="Limpiar Filtros"
      icon="pi pi-times"
      [outlined]="true"
      severity="secondary"
      class="w-full"
      (onClick)="clearFilters()"
    />
  </div>
</div>
