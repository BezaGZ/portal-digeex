<p-card styleClass="album-card" (click)="onCardClick()">
  <div class="relative overflow-hidden rounded-t-lg">
    @if (album().coverPhoto) {
      <img [src]="album().coverPhoto" [alt]="album().title" loading="lazy" class="album-cover w-full h-60 object-cover transition-transform duration-300" />
    } @else {
      <div class="album-cover w-full h-60 object-cover transition-transform duration-300 flex items-center justify-center" style="background-color: var(--color-background)">
        <i class="pi pi-images text-6xl" style="color: var(--color-border)"></i>
      </div>
    }
  </div>

  <div class="p-4">
    <div class="text-sm text-gray-500 dark:text-gray-400 mb-2 flex items-center justify-center gap-1.5">
      <i class="pi pi-calendar text-sm"></i>
      <span>{{ album().date | isoDateLocal: 'longDate' }}</span>
      @if (album().photoCount > 0) {
        <span class="ml-2 flex items-center gap-1">
          <i class="pi pi-images text-sm"></i>
          {{ album().photoCount }}
        </span>
      }
    </div>

    <div class="flex flex-wrap items-center justify-center gap-2 mb-2">
      @if (album().eventType) {
        <span class="inline-flex items-center gap-1 px-2 py-1 rounded-full text-xs font-medium bg-gob-primary dark:bg-gob-primary-night text-white">
          <i class="pi pi-tag text-xs"></i>
          {{ album().eventType }}
        </span>
      }
      @if (album().program) {
        <span class="inline-flex items-center gap-1 px-2 py-1 rounded-full text-xs font-medium bg-gob-primary-light dark:bg-gob-primary-light-night text-white">
          {{ album().program }}
        </span>
      }
    </div>

    <h3 class="text-xl font-medium text-gob-primary dark:text-white mb-2 leading-tight text-center" style="font-family: var(--font-heading)">
      {{ album().title }}
    </h3>

    <p class="text-base text-gray-600 dark:text-gray-400 leading-normal mb-4 line-clamp-2 text-center">
      {{ album().description }}
    </p>

    <p-button
      label="Ver Álbum"
      icon="pi pi-arrow-right"
      iconPos="right"
      severity="primary"
      [rounded]="true"
      styleClass="w-full !font-medium"
      (onClick)="onButtonClick($event)"
    />
  </div>
</p-card>
