<div class="min-h-screen" style="background-color: var(--color-background)">
  @if (isLoading()) {
    <div class="container mx-auto max-w-7xl px-6 py-12">
      <p-skeleton width="150px" height="2.5rem" styleClass="mb-6" />
      <p-skeleton width="60%" height="2.5rem" styleClass="mb-3" />
      <p-skeleton width="40%" height="1.5rem" styleClass="mb-4" />
      <p-skeleton width="80%" height="4rem" styleClass="mb-6" />
      <p-skeleton width="100%" height="600px" />
    </div>
  } @else if (album()) {
    <div class="container mx-auto max-w-7xl px-6 py-12">
      <div class="mb-4">
        <p-button
          label=" Regresar"
          icon="pi pi-arrow-left"
          severity="primary"
          [rounded]="true"
          styleClass="!text-white !font-medium !px-4 !py-2 transition-all duration-200"
          (onClick)="goBack()"
        />
      </div>

      <div class="mb-8">
        <h1
          class="text-4xl mb-3"
          style="
            color: var(--gob-azul-gobierno);
            font-family: var(--font-heading);
            font-weight: 700;
          "
        >
          {{ album()!.title }}
        </h1>

        <div
          class="flex items-center gap-4 mb-3"
          style="color: var(--color-text-secondary); font-family: var(--font-body)"
        >
          <span class="flex items-center gap-2">
            <i class="pi pi-calendar"></i>
            {{ formatDate(album()!.date) }}
          </span>
          <span class="flex items-center gap-2">
            <i class="pi pi-images"></i>
            {{ album()!.photos.length }} {{ album()!.photos.length === 1 ? 'foto' : 'fotos' }}
          </span>
        </div>

        <p
          class="text-lg leading-relaxed max-w-3xl"
          style="color: var(--color-text-primary); font-family: var(--font-body); font-weight: 400"
        >
          {{ album()!.description }}
        </p>
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
        @for (photo of album()!.photos; track photo.id; let i = $index) {
          <div class="photo-grid-item" (click)="openGalleria(i)">
            <img [src]="photo.thumbnailUrl" [alt]="'Foto ' + (i + 1) + ' del álbum'" />
          </div>
        }
      </div>

      <p-galleria
        [value]="album()!.photos"
        [(visible)]="displayGalleria"
        [(activeIndex)]="activeIndex"
        [fullScreen]="true"
        [circular]="true"
        [showItemNavigators]="true"
        [showThumbnails]="false"
        [showItemNavigatorsOnHover]="true"
        [baseZIndex]="100000"
      >
        <ng-template #item let-photo>
          <img [src]="photo.url" style="width: 100%; height: 100%; object-fit: contain" />
        </ng-template>
      </p-galleria>
    </div>
  }
</div>
