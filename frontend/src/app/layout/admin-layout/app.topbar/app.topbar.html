<div class="layout-topbar">
  <div class="layout-topbar-start">
    <button
      class="layout-menu-button layout-topbar-action"
      (click)="layoutService.onMenuToggle()"
    >
      <i class="pi pi-bars"></i>
    </button>
    <app-breadcrumb></app-breadcrumb>
  </div>

  <div class="layout-topbar-actions">
    <div class="layout-config-menu">
      <button
        type="button"
        class="layout-topbar-action"
        (click)="toggleDarkMode()"
        title="Cambiar tema"
      >
        <i
          [ngClass]="{ 'pi ': true, 'pi-moon': layoutService.isDarkTheme(), 'pi-sun': !layoutService.isDarkTheme() }"
        ></i>
      </button>
    </div>

    <button
      class="layout-topbar-menu-button layout-topbar-action"
      pStyleClass="@next"
      enterFromClass="hidden"
      enterActiveClass="animate-scalein"
      leaveToClass="hidden"
      leaveActiveClass="animate-fadeout"
      [hideOnOutsideClick]="true"
    >
      <i class="pi pi-ellipsis-v"></i>
    </button>

    <div class="layout-topbar-menu hidden lg:block">
      <div class="layout-topbar-menu-content">
        <div class="layout-topbar-user" #userMenuWrap>
          <button
            type="button"
            class="layout-topbar-action"
            (click)="toggleUserMenu($event)"
          >
            <i class="pi pi-user"></i>
            <span>{{ userName }}</span>
          </button>
          <div
            class="layout-topbar-user-panel"
            *ngIf="isUserMenuOpen"
          >
            <div class="layout-topbar-user-header">
              <div class="layout-topbar-user-name">{{ userName }}</div>
              <div class="layout-topbar-user-email">{{ userEmail }}</div>
            </div>
            <button
              type="button"
              class="layout-topbar-menu-item"
              (click)="onProfileClick()"
            >
              <i class="pi pi-id-card"></i>
              <span>Perfil</span>
            </button>
            <button
              type="button"
              class="layout-topbar-menu-item"
              (click)="onUploadsClick()"
            >
              <i class="pi pi-upload"></i>
              <span>Mis envios</span>
            </button>
            <button
              type="button"
              class="layout-topbar-logout"
              (click)="onLogout()"
            >
              <i class="pi pi-sign-out"></i>
              <span>Cerrar sesion</span>
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
